name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  TERM: xterm-256color

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # setup-go v6 reads go.mod's toolchain directive, keeping CI on the patched Go 1.26 toolchain.
          go-version-file: go.mod
          cache: true

      - name: Resolve golangci-lint version
        id: golangci_version
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci_version.outputs.version }}
          install-mode: goinstall
          install-only: true
          verify: false

      - name: Lint
        run: golangci-lint run --timeout=10m

      - name: Format check
        run: golangci-lint fmt --diff

      - name: File length guard (max 500 lines)
        run: ./scripts/check_file_length.sh

      # Baseline-drift guard: .golangci.strict.yml must contain every line of
      # .golangci.yml (local devcheck already runs this; CI must too or strict
      # config drift merges green).
      - name: Lint config drift
        run: make lint-config-drift

      # local-prefixes ↔ LOCAL_PREFIXES parity guard — sibling of
      # lint-config-drift; local devcheck runs it, CI must too or fmt config
      # drift merges green.
      - name: Fmt config drift
        run: make check-fmt-config

      - name: Vet
        run: go vet ./...

      - name: Windows cross-compile
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Tidy check
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum

      # internal/update's TestVerifyMinisignCLIParity skips without the CLI;
      # it's the only check that the Go verifier accepts what the release
      # pipeline's minisign invocation actually produces. Pinned sha256-verified
      # install — same script release.yml uses.
      - name: Install minisign
        run: ./scripts/install_minisign.sh

      - name: Test
        run: |
          set -euo pipefail
          pkgs=$(./scripts/test_pkgs.sh)
          if [ -z "$pkgs" ]; then
            echo "no packages selected for unit tests"
            exit 1
          fi
          go test $pkgs

      - name: Test (race)
        run: |
          set -euo pipefail
          pkgs=$(./scripts/test_pkgs.sh)
          if [ -z "$pkgs" ]; then
            echo "no packages selected for race tests"
            exit 1
          fi
          go test -race $pkgs

      # Delegates to the Makefile target so the GOVULNCHECK_VERSION pin has a
      # single source (Makefile) instead of a duplicated env var.
      - name: Govulncheck
        run: make govulncheck

      - name: Harness (center)
        run: go run ./cmd/amux-harness -mode center -frames 5 -warmup 1 -tabs 8 -width 160 -height 48 -hot-tabs 2 -payload-bytes 64 -newline-every 4 -assert-min-visible 100

      - name: Harness (sidebar)
        run: go run ./cmd/amux-harness -mode sidebar -frames 5 -warmup 1 -tabs 8 -width 160 -height 48 -hot-tabs 2 -payload-bytes 64 -newline-every 4 -assert-min-visible 100

      - name: Harness (monitor)
        run: go run ./cmd/amux-harness -mode monitor -frames 5 -warmup 1 -tabs 8 -width 160 -height 48 -hot-tabs 2 -payload-bytes 64 -newline-every 4 -assert-min-visible 100

  tmux-e2e:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Bug #1 (tmux 3.6a rejecting '='-prefixed set-option targets) is version
        # specific, yet CI only ran ubuntu's apt tmux (3.2a-class) — OLDER than the
        # version that produced the bug, so a 3.6a-only regression passed. Run the
        # real-tmux suites against both the apt baseline and a from-source 3.6a so
        # version-specific regressions fail on the leg that can see them.
        tmux: [apt, "3.6a"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # setup-go v6 reads go.mod's toolchain directive, keeping CI on the patched Go 1.26 toolchain.
          go-version-file: go.mod
          cache: true

      - name: Install tmux (${{ matrix.tmux }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.tmux }}" = "apt" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            sudo apt-get update
            sudo apt-get install -y build-essential libevent-dev libncurses-dev bison pkg-config
            ver="${{ matrix.tmux }}"
            # sha256-pinned per matrix version: the tarball is
            # fetched unauthenticated otherwise. Add a case entry for any new
            # matrix version — `shasum -a 256 tmux-${ver}.tar.gz`.
            case "$ver" in
              3.6a) expected="b6d8d9c76585db8ef5fa00d4931902fa4b8cbe8166f528f44fc403961a3f3759" ;;
              *) echo "no pinned sha256 for tmux ${ver}" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/tmux/tmux/releases/download/${ver}/tmux-${ver}.tar.gz" -o /tmp/tmux.tar.gz
            echo "${expected}  /tmp/tmux.tar.gz" | sha256sum -c -
            tar -xzf /tmp/tmux.tar.gz -C /tmp
            cd "/tmp/tmux-${ver}"
            ./configure
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
          fi

      - name: tmux version
        run: |
          set -euo pipefail
          tmux -V
          if [ "${{ matrix.tmux }}" != "apt" ]; then
            tmux -V | grep -Fq "${{ matrix.tmux }}" || { echo "expected tmux ${{ matrix.tmux }} but got: $(tmux -V)"; exit 1; }
          fi

      - name: Test (tmux)
        run: go test -race ./internal/tmux -count=1

      - name: Test (e2e)
        run: go test -race ./internal/e2e -count=1

      # internal/app has real-tmux integration tests (dead-session GC, activity
      # leases, shared-attach) that t.Skip in the tmux-less `test` job and were
      # never run here, so app-layer tmux orchestration only got coverage in the
      # off-PR nightly run. Run them here, where tmux is installed.
      - name: Test (app, real tmux)
        run: go test -race ./internal/app -count=1

      # internal/pty's agent/viewer create path short-circuits at
      # tmux.EnsureAvailable() in the tmux-less `test` job, so its tmux-gated
      # create tests only run here, where tmux is installed.
      - name: Test (pty, real tmux)
        run: go test -race ./internal/pty -count=1

      - name: Assert no real-tmux tests skipped
        run: STRICT_TMUX=1 make tmux-skip-check

  lint-strict-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # setup-go v6 reads go.mod's toolchain directive, keeping CI on the patched Go 1.26 toolchain.
          go-version-file: go.mod
          cache: true

      - name: Resolve golangci-lint version
        id: golangci_version
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci_version.outputs.version }}
          install-mode: goinstall
          install-only: true
          verify: false

      - name: Strict lint (changed code only)
        run: golangci-lint run --config=.golangci.strict.yml --enable=funlen --enable=gocyclo --enable=nestif --new-from-rev=${{ github.event.pull_request.base.sha }} --timeout=10m

      - name: Strict format check
        run: golangci-lint fmt --config=.golangci.strict.yml --diff

  macos-build:
    # Minimal darwin coverage on push to main only (macOS minutes are ~10x
    # linux). Proves the released darwin binary compiles and exercises the
    # darwin-only pbcopy path in internal/ui/common. Race/lint/govulncheck/
    # harness are host-independent and already run on linux.
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # setup-go v6 reads go.mod's toolchain directive, keeping CI on the patched Go 1.26 toolchain.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          set -euo pipefail
          pkgs=$(./scripts/test_pkgs.sh)
          go test $pkgs
