version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Supply-chain policy: prefer versions >=7 days old (matches the repo's
    # minimum-release-age convention) so freshly published releases age before
    # dependabot proposes them.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "github.com/charmbracelet/ultraviolet"
    groups:
      # The Charm stack moves fast and spans two module prefixes; batch it
      # into a single PR so updates don't arrive piecemeal.
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      # Everything else (minor/patch) in one follow-up PR.
      go-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
