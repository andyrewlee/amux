version: 2
# No github-actions ecosystem: this repo runs no GitHub Actions (all CI is
# local via the Makefile). gomod updates remain.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "github.com/charmbracelet/ultraviolet"
    groups:
      # The Charm stack moves fast and spans two module prefixes; batch it
      # into a single PR so updates don't arrive piecemeal.
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      # Everything else (minor/patch) in one follow-up PR.
      go-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
